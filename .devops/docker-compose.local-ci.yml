version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: test_db
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    volumes:
      - ../templates-local:/app/templates-local:ro
    ports:
      - "3000:80"
    depends_on:
      - backend

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://test_user:test_pass@postgres:5432/test_db
      DJANGO_SETTINGS_MODULE: config.settings
    volumes:
      - ../templates-local:/app/templates-local:ro
    ports:
      - "8000:8000"
    depends_on:
      - postgres

volumes:
  postgres_data:
