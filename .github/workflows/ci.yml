name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install backend deps
        run: |
          cd backend && npm ci

      - name: Install frontend deps
        run: |
          cd frontend && npm ci

      - name: Build backend
        run: |
          cd backend && npm run build

      - name: Build frontend
        run: |
          cd frontend && npm run build
