version: '3.8'

services:
  web:
    image: nginx:alpine
    restart: unless-stopped
    user: nginx
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - staging-network
    depends_on:
      - api

  api:
    image: node:20-alpine
    restart: unless-stopped
    user: node
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (res)=>{process.exit(res.statusCode===200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - JWT_SECRET=${JWT_SECRET}
      - PORT=3000
    volumes:
      - ./backend:/app:ro
      - api-data:/app/data
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000"
    networks:
      - staging-network
    depends_on:
      - db
    working_dir: /app
    env_file:
      - .env.staging

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    user: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - staging-network
    env_file:
      - .env.staging

  nginx-proxy:
    image: nginx:alpine
    restart: unless-stopped
    user: nginx
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - "80:80"
    networks:
      - staging-network
    depends_on:
      - web
      - api
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  pgdata:
  api-data:

networks:
  staging-network:
