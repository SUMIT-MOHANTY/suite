version: "3.8"
services:
  web:
    build: ./frontend
    ports:
      - "80:3000"
    depends_on:
      - api
  api:
    build: ./backend
    ports:
      - "4000:4000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/todo
  db:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: todo
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
